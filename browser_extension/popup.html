<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>FlashGet 快车扩展状态</title>
  <style>
    body {
      width: 230px;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
      margin: 0;
      background: #1e1e1e;
      color: #EDEDED;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    .title {
      font-weight: 600;
      font-size: 14px;
      color: #38BDF8;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 12px;
    }
    .status {
      font-size: 11px;
      color: #94A3B8;
      line-height: 1.4;
      background: #262626;
      padding: 8px;
      border-radius: 4px;
    }
    .online {
      color: #22C55E;
      font-weight: 600;
    }
    .offline {
      color: #EF4444;
      font-weight: 600;
    }
    /* Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #4b5563;
      transition: .2s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: #0284c7; }
    input:checked + .slider:before { transform: translateX(16px); }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 20px;">⚡</span>
    <span class="title">FlashGet 快车接管</span>
  </div>

  <div class="row">
    <span>自动接管下载</span>
    <label class="switch">
      <input type="checkbox" id="enableToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="row">
    <span>客户端连通状态</span>
    <span id="connStatus" class="offline">检测中...</span>
  </div>

  <div class="status" id="tip">
    在网页中点击任何下载按钮，本扩展将自动把链接及认证 Cookie 移交给 FlashGet (快车) 多线程并发加速。
  </div>

  <script src="popup.js"></script>
</body>
</html>
